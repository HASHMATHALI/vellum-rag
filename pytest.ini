[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    live: calls the real Groq API (opt-in: pytest -m live)
    rls: requires creating a PostgreSQL role (embedded test server)
addopts = -m "not live" -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
