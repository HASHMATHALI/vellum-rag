# Production-like local stack. Secrets come from .env (see .env.example); nothing sensitive is hard-coded here.
#   cp .env.example .env   # then fill in the REQUIRED values
#   docker compose up -d --build
#   open http://localhost:8080
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vellum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vellum} -d ${POSTGRES_DB:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]          # not published to the host
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vellum}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # true when served over HTTPS
      TRUSTED_PROXY_HOPS: "1"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-documents}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 2g, cpus: "2" }
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on: [backend, frontend]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Optional observability: docker compose --profile observability up -d   (UI on http://localhost:6006)
  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: [observability]
    ports:
      - "127.0.0.1:6006:6006"
    networks: [internal]

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
