# Gateway for docker-compose: one origin for the SPA and the API (cookies stay first-party, no CORS needed).
# TLS: terminate HTTPS at a load balancer / PaaS edge, or mount certificates and enable the 443 server below.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout main;   # no query strings with secrets: the API never puts credentials in URLs

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Edge rate limits (the API also enforces per-user/per-IP limits).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

    upstream backend  { server backend:8000; keepalive 16; }
    upstream frontend { server frontend:8080; }

    server {
        listen 8080 default_server;
        server_name _;
        client_max_body_size 25M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        # Enable once served over HTTPS:
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_common.conf;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_common.conf;
            # Server-Sent Events: stream tokens as they are generated.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # API docs are disabled by the backend in production; do not expose them through the gateway either.
        location ~ ^/(docs|redoc|openapi\.json) { return 404; }

        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_common.conf;
        }
    }
}
